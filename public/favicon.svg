<svg 
  xmlns="http://www.w3.org/2000/svg" 
  viewBox="0 0 32 32" 
  width="32" 
  height="32"
>
  <title>Ryan Zhao</title>
  
  <!-- Black background -->
  <rect 
    x="0" 
    y="0" 
    width="32" 
    height="32" 
    fill="#000000"
  />
  
  <!-- R - metallic silver style -->
  <path 
    d="M6 8h10c2.5 0 4 1.5 4 4s-1.5 4-4 4h-4l6 8" 
    fill="none" 
    stroke="#c0c0c0" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Z - metallic silver style with overlap -->
  <path 
    d="M22 8h8l-8 8h8l-8 8" 
    fill="none" 
    stroke="#c0c0c0" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Overlapping connection line -->
  <path 
    d="M18 22l2 2" 
    fill="none" 
    stroke="#c0c0c0" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg> 